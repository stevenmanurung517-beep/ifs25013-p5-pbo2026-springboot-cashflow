spring:
  application:
    name: ifs25013-p5-pbo2026-springboot-cashflow
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_DATABASE}?prepareThreshold=0
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  sql:
    init:
      mode: never
  devtools:
    restart:
      enabled: true
      # Polling lebih andal di Windows daripada native file watch.
      poll-interval: 1s
      quiet-period: 400ms
    liveload:
      enabled: true

server:
  port: ${APP_PORT:${PORT:8080}}
  servlet:
    session:
      timeout: 8h
      cookie:
        name: CASHFLOWSESSION
        http-only: true

app:
  root-username: ${ROOT_USERNAME:admin}
  root-password: ${ROOT_PASSWORD:admin}
  upload-dir: ${UPLOAD_DIR:uploads}

vaadin:
  launch-browser: false
  liveReload:
    enabled: true